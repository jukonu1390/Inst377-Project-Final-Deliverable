<html>
  <head>
    <title>My Anime Finder - Home</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.0/anime.min.js"></script> 
    <script src="app.js" defer></script>
  </head>

  <body>
    <!-- Header Section -->
    <header id="bar">
      <h1>My Anime Finder</h1>
    </header>

    <!-- Navigation Section -->

    <div class="navContainer">
      
      <nav class="main-nav">
        <ul class="nav-list">
          <li class="item"><a href="home.html">Home</a></li>
          <li class="item"><a href="favorites.html">Favorites</a></li>
          <li class="item"><a href="about.html">About</a></li>
        </ul>
      </nav>
    </div>


    <!-- Main Content Area -->
    <div class="aboutArea">
      <h2>Home</h2>
      <hr />
      <br />
    </div>

    <div class="searchBtn">
      <input type="text" id="animeSearch" placeholder="Search anime..." />
      <button id="searchBtn" onclick="getAnime()">Search</button>
    </div>

    <div class="swiper">
    <!-- Additional required wrapper -->
    <div class="swiper-wrapper" id="slides">
    <!-- Slides -->
    <div class="swiper-slide">Slide 1</div>
    <div class="swiper-slide">Slide 2</div>
    <div class="swiper-slide">Slide 3</div>
    ...
    </div>
    <!-- If we need pagination -->
    <div class="swiper-pagination"></div>

    <!-- If we need navigation buttons -->
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>

    <!-- If we need scrollbar -->
    <div class="swiper-scrollbar"></div>
    </div>
    
  
  <div class="animeBtn">
    <button id="animeBtn" onclick="getRandomAnime()">Press me to Find an Anime to Watch!</button>
  </div>
    

    <div id="animePoster"></div>

    <!-- Footer -->
    <footer id="bar">
      <p>Copyright of someone, somewhere</p>
  </footer>

  </body>
</html>
